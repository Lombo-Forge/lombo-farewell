# nginx: expose only the two routes a page needs, under /farewell/, and add the token on the way through.
# Put these location blocks inside your existing `server { ... }` for jellyfin.example.com.
#
# The token lives in a file only nginx can read (mode 600, owned by the nginx user), for example
# /etc/nginx/farewell-token.conf, containing one line (replace the placeholder with your own token):
#     proxy_set_header Authorization "Bearer changeme-use-a-long-random-token";
# proxy_set_header replaces any Authorization header the visitor sent, so they cannot try tokens.
# Put this path behind the same login or network limit as the rest of your server (docs/security.md).

location = /farewell/v1/leaving {
    limit_except GET { deny all; }
    include /etc/nginx/farewell-token.conf;
    proxy_pass http://lombo-farewell:8098/v1/leaving;
}

location = /farewell/v1/keep {
    limit_except POST { deny all; }
    include /etc/nginx/farewell-token.conf;
    proxy_pass http://lombo-farewell:8098/v1/keep;
}

# Anything else under /farewell/ is not forwarded.
location /farewell/ {
    return 404;
}
